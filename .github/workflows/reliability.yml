name: Production reliability
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install test dependencies on ephemeral runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install pytest==9.1.1 pillow==13.0.0
      - name: Full tests including real symlink creation
        run: python -m pytest -q -rs skills/producing-movie-review-videos/tests
      - name: Require all four symlink regressions to run without skipping
        run: |
          python -m pytest -q -k symlink --junitxml=symlink.xml skills/producing-movie-review-videos/tests
          python -c "import xml.etree.ElementTree as E; s=list(E.parse('symlink.xml').getroot().iter('testcase')); assert len(s)==4 and all(x.find('skipped') is None and x.find('failure') is None and x.find('error') is None for x in s)"
